<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>−100°C — Часть 1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#eef3f7;font-family:Arial,sans-serif}
#stage{position:relative;width:100vw;height:100vh;background:linear-gradient(#0c1119,#070a0e);overflow:hidden}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;pointer-events:none}
.scene.on{opacity:1}
#title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#05070a;z-index:20}
#title h1{font-size:clamp(30px,6vw,74px);margin:0 0 12px;letter-spacing:3px}
#title p{opacity:.6;margin:0 0 34px}
button{border:1px solid #7e9bb3;background:#182431;color:#fff;border-radius:14px;padding:14px 28px;font-size:18px;cursor:pointer}
button:hover{background:#223547}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:bold;z-index:30;background:#05070acc}
#caption{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:clamp(18px,3vw,34px);text-shadow:0 2px 12px #000;z-index:12;opacity:0;transition:opacity .4s}
#clock{position:absolute;top:7%;right:7%;font-size:28px;opacity:.75;z-index:8}
#room{background:radial-gradient(circle at 65% 35%,#25313b 0 7%,#151c24 24%,#090d12 70%);transition:filter 1s}
.wall{position:absolute;left:0;right:0;bottom:0;height:48%;background:linear-gradient(#151c22,#0d1217);border-top:2px solid #29343d}
.floor{position:absolute;left:0;right:0;bottom:0;height:31%;background:repeating-linear-gradient(90deg,#171e23 0 80px,#11171c 80px 160px);transform:perspective(450px) rotateX(48deg);transform-origin:bottom}
.bed{position:absolute;left:8%;bottom:29%;width:43%;height:20%;background:#222c34;border-radius:12px 12px 4px 4px;box-shadow:0 15px 30px #000}
.pillow{position:absolute;left:7%;top:-22%;width:34%;height:45%;background:#a9b6bf;border-radius:16px;transform:rotate(-4deg)}
.blanket{position:absolute;right:0;top:-7%;width:74%;height:85%;background:#394851;border-radius:30px 10px 4px 4px}
.desk{position:absolute;right:7%;bottom:30%;width:32%;height:8%;background:#252e35}
.monitor{position:absolute;right:12%;bottom:38%;width:22%;height:22%;background:#050708;border:5px solid #202a31;border-radius:5px;box-shadow:0 0 25px #31475a55}
.code{font:12px monospace;color:#5b91a9;padding:8px;line-height:1.3}
.window{position:absolute;right:8%;top:12%;width:35%;height:45%;background:#0a1117;border:8px solid #1e272e;overflow:hidden;box-shadow:0 0 30px #000}
.curtain{position:absolute;top:0;width:51%;height:100%;background:linear-gradient(90deg,#30383d,#1d252a);z-index:2}
.curtain.l{left:0}.curtain.r{right:0}
.outside{position:absolute;inset:0;background:linear-gradient(#d7e4ec,#9db0bd);display:flex;align-items:flex-end;gap:8%;padding:0 8% 8%;filter:saturate(.35)}
.tree{width:13%;height:60%;background:#52646d;clip-path:polygon(50% 0,65% 35%,58% 35%,82% 65%,65% 65%,90% 100%,10% 100%,35% 65%,18% 65%,42% 35%,35% 35%)}
.snowground{position:absolute;bottom:0;left:0;right:0;height:38%;background:#dbe8ee}
.city{position:absolute;bottom:30%;left:0;right:0;height:35%;display:flex;align-items:end;gap:3%;padding:0 4%}
.bld{width:14%;height:65%;background:#83939d}.bld:nth-child(2){height:85%}.bld:nth-child(3){height:55%}.bld:nth-child(4){height:75%}
.thermo{position:absolute;top:8%;left:8%;background:#14202a;color:#d8f1ff;padding:8px 12px;border-radius:7px;font:700 18px monospace}
#phone{position:absolute;right:32%;bottom:23%;width:48px;height:92px;border:4px solid #d7e0e5;border-radius:10px;background:#081016;z-index:10;box-shadow:0 0 25px #bce9ff88}
#beam{position:absolute;left:43%;top:20%;width:70%;height:100%;background:linear-gradient(135deg,#dff7ff55,transparent 45%);clip-path:polygon(0 0,100% 30%,100% 100%,0 45%);opacity:0;z-index:6}
#doorScene{background:#0a0e12}
.door{position:absolute;left:50%;top:8%;transform:translateX(-50%);height:84%;width:min(54vw,500px);background:linear-gradient(90deg,#262b30,#14191d 50%,#252b30);border:12px solid #313a40;box-shadow:0 0 50px #000}
.handle{position:absolute;left:50%;top:50%;width:32px;height:32px;border-radius:50%;background:#aeb8bd;transform:translate(-50%,-50%);box-shadow:0 0 10px #fff4}
.eye{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:32px;color:#b9d0dc;opacity:.95}
.knobless{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:34px;color:#d8e7ee;opacity:0}
#hand{position:absolute;left:52%;top:52%;width:65px;height:65px;border-radius:50%;background:#c9a38e;opacity:0;z-index:4}
#flash{position:absolute;inset:0;background:#eaf9ff;opacity:0;z-index:40;pointer-events:none}
.shake{animation:shake .15s 3}.pulse{animation:pulse 1.2s infinite}
@keyframes shake{50%{transform:translateX(5px)}}@keyframes pulse{50%{opacity:.35}}
#final{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#030507;z-index:25}
#final .box{text-align:center}.final9{font-size:80px;color:#dbeaf2;opacity:.8}
</style>
</head>
<body>
<div id="stage">
  <div id="title"><h1>−100°C</h1><p>ЧАСТЬ 1 · НЕИЗВЕСТНОСТЬ</p><button id="play">▶ ИГРАТЬ</button></div>
  <div id="count"></div>

  <section id="room" class="scene on">
    <div id="clock">12:00</div>
    <div class="window">
      <div class="outside"><div class="thermo">−100°C</div><div class="city"><i class="bld"></i><i class="bld"></i><i class="bld"></i><i class="bld"></i></div><div class="snowground"></div><i class="tree"></i><i class="tree"></i><i class="tree"></i></div>
      <div class="curtain l"></div><div class="curtain r"></div>
    </div>
    <div class="bed"><div class="pillow"></div><div class="blanket"></div></div>
    <div class="desk"><div class="monitor"><div class="code">const site = ...<br>function start(){<br>&nbsp;&nbsp;render();<br>}</div></div></div>
    <div class="wall"></div><div class="floor"></div>
    <div id="phone"></div><div id="beam"></div>
  </section>

  <section id="doorScene" class="scene">
    <div class="door"><div class="eye">9</div><div class="handle"></div><div id="lock"></div></div>
    <div id="hand"></div>
  </section>

  <div id="caption"></div><div id="flash"></div>
  <div id="final"><div class="box"><div class="final9">9</div><p>КОНЕЦ ЧАСТИ 1</p></div></div>
</div>

<script>
const $=s=>document.querySelector(s);
const room=$('#room'), door=$('#doorScene'), cap=$('#caption'), count=$('#count'), title=$('#title');
let timer=null, audio=null;

function say(t,ms=2600){cap.textContent=t;cap.style.opacity=1;clearTimeout(timer);timer=setTimeout(()=>cap.style.opacity=0,ms)}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function tone(freq,dur,type='sine',gain=.035){
  if(!audio)return;
  const o=audio.createOscillator(), g=audio.createGain();
  o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g).connect(audio.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.stop(audio.currentTime+dur);
}
function knock(){tone(85,.18,'triangle',.12);setTimeout(()=>tone(70,.15,'triangle',.1),240)}
async function run(){
  title.style.display='none';
  count.style.display='flex';
  for(const n of [3,2,1]){count.textContent=n;tone(300,.15,'sine',.04);await sleep(800)}
  count.textContent='';count.style.display='none';
  say('12:00',1200);await sleep(1500);
  say('Максим просыпается. В комнате слишком холодно.',2800);await sleep(2800);
  $('#clock').textContent='12:00  ⟟  ▫︎  ϟ'; tone(180,.3,'square',.015);await sleep(900);
  $('#clock').textContent='12:00';await sleep(900);
  say('Странно…',1800);await sleep(1800);
  say('Почему здесь так холодно?',2200);await sleep(2200);
  document.querySelector('.curtain.l').style.transform='translateX(-105%)';document.querySelector('.curtain.r').style.transform='translateX(105%)';
  say('За окном — мёртвый холод.',2600);await sleep(2600);
  say('−100°C',2200);tone(55,1.2,'sine',.05);await sleep(2200);
  say('Электричество не работает.',2400);await sleep(2400);
  $('#phone').style.boxShadow='0 0 25px #bce9ffcc';$('#beam').style.opacity=.8;tone(700,.2,'sine',.03);await sleep(1800);
  say('Он идёт на кухню…',2000);await sleep(2300);
  room.classList.remove('on');door.classList.add('on');await sleep(900);
  say('ТУК.',900);knock();await sleep(1100);
  say('ТУК.',900);knock();await sleep(1200);
  say('— Есть кто-нибудь дома?!',2600);await sleep(2700);
  say('— Пожалуйста! Нам нужна помощь!',2800);await sleep(2800);
  say('Максим подходит к двери.',2200);await sleep(2200);
  say('Он замечает номер «9» вместо глазка.',3000);await sleep(3000);
  say('— Откройте! Пожалуйста!',2200);knock();await sleep(2200);
  $('.handle').classList.add('shake');say('Дверь не открывается.',2300);await sleep(2400);
  $('#lock').style.width='0';say('Замка… нет.',2800);await sleep(3000);
  say('— Вы здесь?..',2400);await sleep(2600);
  $('#final').style.display='flex';await sleep(3000);
}
$('#play').onclick=()=>{audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume();run()}
</script>
</body>
</html>
