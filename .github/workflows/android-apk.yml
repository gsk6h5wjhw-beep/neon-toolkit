name: Build STANDOFF TOOL APK

‘on’:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Install Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
  - name: Install Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'
  - name: Install Android SDK
    uses: android-actions/setup-android@v3
  - name: Install SDK packages
    run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
  - name: Generate Android project
    shell: bash
    run: |
      mkdir -p app/src/main/java/com/neontoolkit/standoff
      mkdir -p app/src/main/res/values
      cat > settings.gradle <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }
      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }
      rootProject.name = "STANDOFF-TOOL"
      include ':app'
      EOF
      cat > build.gradle <<'EOF'
      plugins {
          id 'com.android.application' version '8.6.1' apply false
      }
      EOF
      cat > gradle.properties <<'EOF'
      org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
      android.useAndroidX=true
      EOF
      cat > app/build.gradle <<'EOF'
      plugins {
          id 'com.android.application'
      }
      android {
          namespace 'com.neontoolkit.standoff'
          compileSdk 35
          defaultConfig {
              applicationId 'com.neontoolkit.standoff'
              minSdk 28
              targetSdk 32
              versionCode 1
              versionName '1.0'
          }
      }
      EOF
      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
          <application
              android:theme="@android:style/Theme.Material.NoActionBar"
              android:label="STANDOFF TOOL">
              <activity
                  android:name=".MainActivity"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
              </activity>
              <service
                  android:name=".CrosshairService"
                  android:exported="false"/>
          </application>
      </manifest>
      EOF
      cat > app/src/main/java/com/neontoolkit/standoff/MainActivity.java <<'EOF'
      package com.neontoolkit.standoff;
      import android.app.*;
      import android.os.*;
      import android.content.*;
      import android.graphics.Color;
      import android.provider.Settings;
      import android.view.*;
      import android.widget.*;
      import android.graphics.Typeface;
      public class MainActivity extends Activity {
          LinearLayout root, content, nav;
          int accent = Color.rgb(0,220,180);
          String tab = "Crosshair";
          int crossColor = Color.GREEN;
          int size = 24;
          String shape = "Крест";
          public void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setStatusBarColor(Color.rgb(12,14,22));
              getWindow().setNavigationBarColor(Color.rgb(12,14,22));
              root = new LinearLayout(this);
              root.setOrientation(1);
              root.setPadding(18,18,18,12);
              root.setBackgroundColor(Color.rgb(12,14,22));
              setContentView(root);
              TextView title = new TextView(this);
              title.setText("STANDOFF TOOL");
              title.setTextSize(25);
              title.setTypeface(null,Typeface.BOLD);
              title.setTextColor(accent);
              root.addView(title);
              content = new LinearLayout(this);
              content.setOrientation(1);
              LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(-1,0,1);
              cp.topMargin=20;
              root.addView(content,cp);
              nav = new LinearLayout(this);
              root.addView(nav);
              for(String t:new String[]{"Resolution","Crosshair","Presets","Settings"}) {
                  Button n = new Button(this);
                  n.setText(t);
                  n.setTextSize(10);
                  n.setOnClickListener(v->{tab=t;showTab();});
                  nav.addView(n,new LinearLayout.LayoutParams(0,-2,1));
              }
              showTab();
          }
          void addText(String s) {
              TextView v=new TextView(this);
              v.setText(s); v.setTextColor(Color.WHITE); v.setTextSize(16);
              v.setPadding(4,12,4,12); content.addView(v);
          }
          void addButton(String s,Runnable r) {
              Button b=new Button(this); b.setText(s);
              b.setOnClickListener(v->r.run()); content.addView(b);
          }
          void showTab() {
              content.removeAllViews();
              addText(tab.toUpperCase());
              if(tab.equals("Resolution")) {
                  addText("Профиль экрана (локальная настройка)");
                  for(String p:new String[]{"16:9","4:3","16:10","Custom"}) {
                      addButton(p,()->{
                          getPreferences(0).edit().putString("resolution",p).apply();
                          Toast.makeText(this,"Сохранён профиль "+p+"; разрешение игры не изменено",0).show();
                      });
                  }
                  addText("Без root/ADB приложение не может гарантированно растянуть изображение Standoff 2.");
              } else if(tab.equals("Crosshair")) {
                  addText("Форма: "+shape);
                  for(String s:new String[]{"Крест","Точка","Круг","T-образный"}) {
                      addButton(s,()->{shape=s;showTab();});
                  }
                  addButton("Изменить цвет",()->{
                      crossColor = crossColor==Color.GREEN ? Color.CYAN :
                          crossColor==Color.CYAN ? Color.RED : Color.GREEN;
                      showTab();
                  });
                  addButton("Размер: "+size+" (изменить)",()->{
                      size=size>=48?12:size+6;showTab();
                  });
                  addButton("Предпросмотр",()->{
                      new AlertDialog.Builder(this).setTitle("Прицел: "+shape)
                        .setMessage("Размер: "+size+" px\nЦвет меняется кнопкой цвета.")
                        .setPositiveButton("OK",null).show();
                  });
                  addButton("Запустить плавающий прицел",()->{
                      if(!Settings.canDrawOverlays(this)) {
                          Intent i=new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                            android.net.Uri.parse("package:"+getPackageName()));
                          startActivity(i);
                      } else {
                          Intent i=new Intent(this,CrosshairService.class);
                          i.putExtra("color",crossColor);
                          i.putExtra("size",size);
                          i.putExtra("shape",shape);
                          startService(i);
                          Toast.makeText(this,"Прицел запущен",0).show();
                      }
                  });
                  addButton("Отключить прицел",()->stopService(new Intent(this,CrosshairService.class)));
              } else if(tab.equals("Presets")) {
                  EditText name=new EditText(this); name.setHint("Название пресета");
                  content.addView(name);
                  addButton("Сохранить пресет",()->{
                      getPreferences(0).edit()
                        .putString("presetName",name.getText().toString())
                        .putString("presetShape",shape)
                        .putInt("presetColor",crossColor)
                        .putInt("presetSize",size).apply();
                      Toast.makeText(this,"Пресет сохранён локально",0).show();
                  });
                  addButton("Применить последний пресет",()->{
                      shape=getPreferences(0).getString("presetShape","Крест");
                      crossColor=getPreferences(0).getInt("presetColor",Color.GREEN);
                      size=getPreferences(0).getInt("presetSize",24);
                      showTab();
                  });
                  addButton("Удалить последний пресет",()->{
                      getPreferences(0).edit().remove("presetName")
                        .remove("presetShape").remove("presetColor").remove("presetSize").apply();
                      Toast.makeText(this,"Пресет удалён",0).show();
                  });
              } else {
                  addText("Android 9+ • локальное хранение");
                  addButton("Проверить разрешение overlay",()->{
                      Toast.makeText(this,Settings.canDrawOverlays(this) ?
                        "Разрешение выдано":"Разрешение не выдано",0).show();
                  });
                  addButton("Остановить прицел",()->stopService(new Intent(this,CrosshairService.class)));
                  addButton("Сбросить настройки",()->{
                      new AlertDialog.Builder(this).setMessage("Сбросить настройки и пресет?")
                        .setNegativeButton("Отмена",null)
                        .setPositiveButton("Сбросить",(d,w)->{
                          getPreferences(0).edit().clear().apply();
                          shape="Крест";size=24;crossColor=Color.GREEN;showTab();
                        }).show();
                  });
              }
          }
      }
      EOF
      cat > app/src/main/java/com/neontoolkit/standoff/CrosshairService.java <<'EOF'
      package com.neontoolkit.standoff;
      import android.app.Service;
      import android.content.Intent;
      import android.graphics.*;
      import android.graphics.PixelFormat;
      import android.os.IBinder;
      import android.provider.Settings;
      import android.view.*;
      public class CrosshairService extends Service {
          WindowManager wm;
          View overlay;
          public int onStartCommand(Intent i,int flags,int id) {
              if(!Settings.canDrawOverlays(this)) { stopSelf(); return START_NOT_STICKY; }
              if(overlay!=null) { try { wm.removeView(overlay); } catch(Exception e) {} }
              int color=i.getIntExtra("color",Color.GREEN);
              int size=i.getIntExtra("size",24);
              String shape=i.getStringExtra("shape");
              overlay=new View(this) {
                  Paint p=new Paint(3);
                  protected void onDraw(Canvas c) {
                      super.onDraw(c); p.setColor(color); p.setStrokeWidth(3);
                      p.setStyle(Paint.Style.STROKE);
                      float x=getWidth()/2f,y=getHeight()/2f,s=size;
                      if("Точка".equals(shape)) { p.setStyle(Paint.Style.FILL); c.drawCircle(x,y,Math.max(3,s/5),p); }
                      else if("Круг".equals(shape)) c.drawCircle(x,y,s/2,p);
                      else if("T-образный".equals(shape)) { c.drawLine(x-s/2,y-s/2,x+s/2,y-s/2,p); c.drawLine(x,y-s/2,x,y+s/2,p); }
                      else { c.drawLine(x-s/2,y,x+s/2,y,p); c.drawLine(x,y-s/2,x,y+s/2,p); }
                  }
              };
              wm=(WindowManager)getSystemService(WINDOW_SERVICE);
              WindowManager.LayoutParams lp=new WindowManager.LayoutParams(
                  WindowManager.LayoutParams.MATCH_PARENT,
                  WindowManager.LayoutParams.MATCH_PARENT,
                  WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                  WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE |
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                  WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                  PixelFormat.TRANSLUCENT);
              lp.gravity=Gravity.TOP|Gravity.START;
              try { wm.addView(overlay,lp); } catch(Exception e) { stopSelf(); }
              return START_NOT_STICKY;
          }
          public void onDestroy() {
              if(wm!=null&&overlay!=null) try { wm.removeView(overlay); } catch(Exception e) {}
              super.onDestroy();
          }
          public IBinder onBind(Intent i) { return null; }
      }
      EOF
  - name: Build APK
    run: gradle assembleDebug
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: standoff-tool-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
