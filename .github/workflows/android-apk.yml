steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install SDK packages
    run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

  - name: Check project files
    run: |
      test -f settings.gradle || (echo "Missing settings.gradle" && exit 1)
      test -f app/build.gradle || (echo "Missing app/build.gradle" && exit 1)

  - name: Build APK
    run: gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: standoff-tool-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
