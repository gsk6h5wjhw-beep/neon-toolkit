
name: Build NEON TOOLKIT from source archive

on:
  workflow_dispatch:
  push:
    paths:
      - "neon-toolkit-source.zip"
      - ".github/workflows/build-from-archive.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack source archive
        run: |
          mkdir project
          unzip -q neon-toolkit-source.zip -d project
          test -f project/settings.gradle
          test -f project/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle --no-daemon -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-toolkit-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
